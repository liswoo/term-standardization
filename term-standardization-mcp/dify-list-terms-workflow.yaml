app:
  description: 프론트엔드 대시보드용 읽기 전용 워크플로우. 표준용어/표준단어 카탈로그(페이지네이션), 검토 대기 등록 요청, 표준도메인
    전체 목록을 반환한다.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 용어표준화-목록조회
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      data:
        title: 시작
        type: start
        desc: ''
        version: '1'
        variables:
        - variable: limit
          label: limit
          type: number
          required: false
        - variable: offset
          label: offset
          type: number
          required: false
        - variable: q
          label: q
          type: text-input
          max_length: 200
          required: false
        - variable: status
          label: status
          type: text-input
          max_length: 20
          required: false
        - variable: domain
          label: domain
          type: text-input
          max_length: 100
          required: false
        - variable: requester
          label: requester
          type: text-input
          max_length: 200
          required: false
        - variable: words_limit
          label: words_limit
          type: number
          required: false
        - variable: words_offset
          label: words_offset
          type: number
          required: false
        - variable: words_q
          label: words_q
          type: text-input
          max_length: 200
          required: false
        - variable: words_status
          label: words_status
          type: text-input
          max_length: 20
          required: false
        - variable: words_requester
          label: words_requester
          type: text-input
          max_length: 200
          required: false
        - variable: words_is_format_word
          label: words_is_format_word
          type: text-input
          max_length: 10
          required: false
      position:
        x: 0
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: list_terms
      type: custom
      data:
        title: list_terms
        type: tool
        desc: ''
        version: '1'
        provider_id: term-standardization
        provider_name: term-standardization
        provider_show_name: term-standardization
        provider_type: mcp
        provider_icon:
          background: '#6366F1'
          content: 🔗
        plugin_id: ''
        plugin_unique_identifier: ''
        tool_name: list_terms
        tool_label: list_terms
        tool_description: 실제 표준용어 카탈로그와 검토 대기 등록 요청 목록을 페이지 단위로 조회한다.
        tool_node_version: '2'
        tool_configurations: {}
        tool_parameters:
          limit:
            type: mixed
            value: '{{#start.limit#}}'
          offset:
            type: mixed
            value: '{{#start.offset#}}'
          q:
            type: mixed
            value: '{{#start.q#}}'
          status:
            type: mixed
            value: '{{#start.status#}}'
          domain:
            type: mixed
            value: '{{#start.domain#}}'
          requester:
            type: mixed
            value: '{{#start.requester#}}'
        is_team_authorization: true
        paramSchemas: []
        params: {}
      position:
        x: 340
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: list_standard_words
      type: custom
      data:
        title: list_standard_words
        type: tool
        desc: ''
        version: '1'
        provider_id: term-standardization
        provider_name: term-standardization
        provider_show_name: term-standardization
        provider_type: mcp
        provider_icon:
          background: '#6366F1'
          content: 🔗
        plugin_id: ''
        plugin_unique_identifier: ''
        tool_name: list_standard_words
        tool_label: list_standard_words
        tool_description: 표준단어(standard_words) 사전을 페이지 단위로 조회한다.
        tool_node_version: '2'
        tool_configurations: {}
        tool_parameters:
          limit:
            type: mixed
            value: '{{#start.words_limit#}}'
          offset:
            type: mixed
            value: '{{#start.words_offset#}}'
          q:
            type: mixed
            value: '{{#start.words_q#}}'
          status:
            type: mixed
            value: '{{#start.words_status#}}'
          requester:
            type: mixed
            value: '{{#start.words_requester#}}'
          is_format_word:
            type: mixed
            value: '{{#start.words_is_format_word#}}'
        is_team_authorization: true
        paramSchemas: []
        params: {}
      position:
        x: 680
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: list_data_domains
      type: custom
      data:
        title: list_data_domains
        type: tool
        desc: ''
        version: '1'
        provider_id: term-standardization
        provider_name: term-standardization
        provider_show_name: term-standardization
        provider_type: mcp
        provider_icon:
          background: '#6366F1'
          content: 🔗
        plugin_id: ''
        plugin_unique_identifier: ''
        tool_name: list_data_domains
        tool_label: list_data_domains
        tool_description: 실제 활성 표준도메인 전체 목록을 조회한다 (페이지네이션 없음).
        tool_node_version: '2'
        tool_configurations: {}
        tool_parameters: {}
        is_team_authorization: true
        paramSchemas: []
        params: {}
      position:
        x: 1020
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: end
      type: custom
      data:
        title: 출력
        type: end
        desc: ''
        version: '1'
        outputs:
        - variable: terms
          value_selector:
          - list_terms
          - json
          value_type: array[object]
        - variable: words
          value_selector:
          - list_standard_words
          - json
          value_type: array[object]
        - variable: domains
          value_selector:
          - list_data_domains
          - json
          value_type: array[object]
      position:
        x: 1360
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    edges:
    - id: start-list_terms
      type: custom
      source: start
      target: list_terms
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: tool
    - id: list_terms-list_standard_words
      type: custom
      source: list_terms
      target: list_standard_words
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: tool
        targetType: tool
    - id: list_standard_words-list_data_domains
      type: custom
      source: list_standard_words
      target: list_data_domains
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: tool
        targetType: tool
    - id: list_data_domains-end
      type: custom
      source: list_data_domains
      target: end
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: tool
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
