app:
  description: 프론트엔드 대시보드용 읽기 전용 워크플로우. 실제 표준용어 카탈로그와 검토 대기 등록 요청 목록을 반환한다.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 용어표준화-목록조회
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      data:
        title: 시작
        type: start
        desc: ''
        version: '1'
        variables: []
      position:
        x: 0
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: list_terms
      type: custom
      data:
        title: list_terms
        type: tool
        desc: ''
        version: '1'
        provider_id: term-standardization
        provider_name: term-standardization
        provider_show_name: term-standardization
        provider_type: mcp
        provider_icon:
          background: '#6366F1'
          content: 🔗
        plugin_id: ''
        plugin_unique_identifier: ''
        tool_name: list_terms
        tool_label: list_terms
        tool_description: 실제 표준용어 카탈로그와 검토 대기 등록 요청 목록을 조회한다.
        tool_node_version: '2'
        tool_configurations: {}
        tool_parameters:
          limit:
            type: constant
            value: 100
        is_team_authorization: true
        paramSchemas: []
        params: {}
      position:
        x: 340
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: end
      type: custom
      data:
        title: 출력
        type: end
        desc: ''
        version: '1'
        outputs:
        - variable: terms
          value_selector:
          - list_terms
          - json
          value_type: array[object]
      position:
        x: 680
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    edges:
    - id: start-list_terms
      type: custom
      source: start
      target: list_terms
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: tool
    - id: list_terms-end
      type: custom
      source: list_terms
      target: end
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: tool
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
