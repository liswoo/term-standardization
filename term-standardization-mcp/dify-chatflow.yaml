    - id: render_context
      type: custom
      data:
        title: 단계별 설명 자료
        type: code
        desc: ''
        version: '1'
        code_language: python3
        variables:
        - variable: action
          value_selector:
          - action
          - json
        - variable: rag
          value_selector:
          - rag
          - result
        outputs:
          context:
            type: string
            children: null
          options:
            type: string
            children: null
          resume_notice:
            type: string
            children: null
        code: "import json\n\ndef main(action: list, rag: list) -> dict:\n    result=action[0]\
          \ if action else {\"error\":\"EMPTY_MCP_RESULT\"}\n    # Retrieval must\
          \ never override a pending extraction/name confirmation.\n    reference=rag\
          \ if result.get(\"next_action\") in [\"show_candidates\",\"help\"] else\
          \ []\n    # Pre-format the domain table as plain text so the reply LLM only\
          \ has to\n    # restate it, instead of relying on it to correctly interpret\
          \ nested JSON\n    # (it was silently dropping the domain options when asked\
          \ to do both).\n    state=result.get(\"state\",{})\n    domains=state.get(\"\
          domains\",{})\n    stage=state.get(\"stage\")\n    error=result.get(\"error\"\
          )\n    # The \"새 용어를/단어를 등록할래요\" terminal-stage buttons deliberately re-fire\n\
          \    # propose_term/propose_word/find_term with an empty value (see CLASSIFY_TERMINAL_RULE)\n\
          \    # to reuse the existing TERM_REQUIRED/WORD_MEANING_REQUIRED/TERM_MEANING_REQUIRED\n\
          \    # \"ask for the next name/description\" flow - but the stage itself\
          \ is still e.g.\n    # \"submitted\" or \"word_reused\", whose own RENDER\
          \ guidance narrates a completed/\n    # blocked outcome. Both instructions\
          \ would otherwise fire in the same turn and the\n    # reply LLM would restate\
          \ stale \"접수 완료\"/\"차단\" narration nobody asked about this\n    # turn -\
          \ same \"don't let two simultaneous instructions blend\" lesson as\n   \
          \ # meaning_required_hint. (The frontend has the same \"stale stage\" problem\
          \ for the\n    # table/buttons it renders from business_result.state - see\
          \ app.js's needsFreshInput,\n    # which reads this same set of error codes\
          \ off the action node's own output.)\n    suppress_stage_summary=error in\
          \ (\"TERM_REQUIRED\",\"WORD_MEANING_REQUIRED\",\"TERM_MEANING_REQUIRED\"\
          ) and stage in (\n        \"submitted\",\"registration_failed\",\"existing_term_found\"\
          ,\"pending_request_found\",\"definition_blocked\",\"cancelled\",\n     \
          \   \"word_reused\",\"word_submitted\",\"word_registration_failed\",\"word_request_blocked\"\
          ,\"term_lookup_result\")\n    # The \"여기서 마칠게요\" terminal-stage button sends\
          \ restart (see CLASSIFY_TERMINAL_RULE),\n    # which conversation.py resets\
          \ to a bare {\"stage\":\"awaiting_term_direct\"} - no leftover\n    # fields\
          \ to redact, so unlike suppress_stage_summary above this needs no flag-based\n\
          \    # override, just a fixed reply decided here instead of left to the\
          \ reply LLM's own\n    # \"cancelled/restart\" wording (same \"code decides\
          \ the sentence\" reasoning throughout\n    # this function).\n    close_hint=\"\
          네, 알겠습니다! 필요하실 때 다시 말씀해주세요.\" if result.get(\"next_action\")==\"restart\"\
          \ else \"\"\n    # WORD_MEANING_REQUIRED and TERM_MEANING_REQUIRED are structurally\
          \ near-identical\n    # errors (\"describe the concept\") that only differ\
          \ in 단어 vs 용어 - prose alone\n    # (even reworded twice) could not stop\
          \ the reply LLM from reusing one error's\n    # phrasing for the other.\
          \ Same fix as definition_hint/word_hint: decide the exact\n    # sentence\
          \ in code, the model only relays it.\n    if error==\"WORD_MEANING_REQUIRED\"\
          :\n        meaning_required_hint=\"어떤 개념을 어떤 용도로 쓰고 계신지, 그 표준단어의 의미를 설명해\
          \ 달라고 요청하세요.\"\n    elif error==\"TERM_MEANING_REQUIRED\":\n        meaning_required_hint=\"\
          어떤 개념을 표현할 표준용어를 찾으시는지, 그 의미를 설명해 달라고 요청하세요.\"\n    else:\n        meaning_required_hint=\"\
          \"\n    needs_domain_summary=(result.get(\"next_action\")==\"CHOOSE_DOMAIN\"\
          \ or error==\"UNRECOGNIZED_DOMAIN\"\n        or (result.get(\"next_action\"\
          )==\"show_candidates\" and stage==\"awaiting_domain_choice\"))\n    domain_summary=\"\
          \"\n    # Deterministic, stage-driven quick-reply choices for the frontend\
          \ so the\n    # user can click instead of retyping exact phrases the classifier\
          \ expects.\n    options=[]\n    if needs_domain_summary:\n        lines=[]\n\
          \        # 실제 비교군에 1건이라도 등장한 도메인만, 최대 10개 - 후보가 최대 30건까지\n        # 모이는\
          \ real 카탈로그에서는 서로 다른 도메인이 10개를 훌쩍 넘을 수 있다.\n        # (이 요약/버튼 목록은 app.js의\
          \ renderDomainTable()과 반드시 같은 규칙이어야\n        # 화면 표와 채팅 버튼이 서로 다른 개수를 보여주는\
          \ 일이 없다.)\n        distribution=domains.get(\"distribution\",[])[:10]\n\
          \        for row in distribution:\n            pct=round(row[\"ratio\"]*100)\n\
          \            lines.append(f\"- {row['domain']} ({row.get('domain_description')\
          \ or '설명 없음'}): 비교군 {row['count']}/{domains.get('sample_size',row['count'])}건\
          \ 사용, 관측 비율 {pct}%\")\n            options.append({\"label\":f\"{row['domain']}\
          \ ({row.get('domain_description') or '설명 없음'})\",\"value\":row[\"domain\"\
          ]})\n        # 비교 근거가 하나도 없을 때만 - 그래도 뭐라도 고를 수 있게 최대 5개 폴백.\n        if\
          \ not distribution:\n            for d in domains.get(\"known_domains\"\
          ,[])[:5]:\n                lines.append(f\"- {d['code']} ({d.get('description')\
          \ or '설명 없음'}): 비교군에는 없지만 등록 가능한 도메인\")\n                options.append({\"\
          label\":f\"{d['code']} ({d.get('description') or '설명 없음'})\",\"value\":d[\"\
          code\"]})\n        domain_summary=\"\\n\".join(lines) if lines else \"비교\
          \ 가능한 근거가 없어 추천을 만들 수 없습니다. known_domains 중 하나를 직접 선택해야 합니다.\"\n    elif\
          \ stage==\"awaiting_term_confirm\":\n        options=[{\"label\":\"네, 맞아요\"\
          ,\"value\":\"네, 맞아요\"},{\"label\":\"아니요, 다시 입력할게요\",\"value\":\"아니요, 다시\
          \ 입력할게요\"}]\n    elif stage==\"awaiting_guideline_choice\":\n        # A\
          \ guideline (RAG) block has no mechanical suggestions of its own; fold its\n\
          \        # suggested_term in as an extra quick-reply choice so it's clickable\
          \ too.\n        opts=list(state.get(\"validation\",{}).get(\"suggestions\"\
          ,[]))\n        guideline_suggestion=(state.get(\"guideline_check\") or {}).get(\"\
          suggested_term\")\n        if guideline_suggestion and guideline_suggestion\
          \ not in opts:\n            opts.append(guideline_suggestion)\n        options=[{\"\
          label\":s,\"value\":s} for s in opts]\n    elif stage==\"awaiting_definition\"\
          :\n        def_sug=state.get(\"definition_suggestion\") or {}\n        if\
          \ def_sug.get(\"ambiguous\"):\n            options=[{\"label\":o,\"value\"\
          :o} for o in def_sug.get(\"options\",[])]\n        elif def_sug.get(\"definition\"\
          ):\n            options=[{\"label\":\"네, 이 정의로 할게요\",\"value\":def_sug[\"\
          definition\"]}]\n    elif stage==\"awaiting_abbreviation\":\n        suggested=(state.get(\"\
          abbreviation_suggestion\") or {}).get(\"abbreviation\")\n        options=[{\"\
          label\":f\"네, {suggested}로 할게요\",\"value\":suggested}] if suggested else\
          \ []\n    elif stage==\"awaiting_confirm\":\n        options=[{\"label\"\
          :\"네, 등록해주세요\",\"value\":\"네, 등록해주세요\"},{\"label\":\"아니요, 취소할게요\",\"value\"\
          :\"아니요, 취소할게요\"}]\n    elif stage==\"awaiting_word_confirm\":\n        word_sug=state.get(\"\
          word_suggestion\") or {}\n        if word_sug.get(\"ambiguous\"):\n    \
          \        options=[{\"label\":o,\"value\":o} for o in word_sug.get(\"options\"\
          ,[])]\n        elif word_sug.get(\"existing_word_match\"):\n           \
          \ options=[{\"label\":f\"네, '{word_sug['existing_word_match']}' 단어를 쓸게요\"\
          ,\"value\":\"네, 그 단어 쓸게요\"}]\n        elif word_sug.get(\"name\") and word_sug.get(\"\
          english_abbr\"):\n            options=[{\"label\":f\"네, '{word_sug['name']}'(으)로\
          \ 등록할게요\",\"value\":\"네, 등록할게요\"},\n                {\"label\":\"내가 새로 정의할래요\"\
          ,\"value\":\"내가 새로 정의할래요\"}]\n    elif stage==\"awaiting_word_abbreviation\"\
          :\n        suggested=(state.get(\"word_registration_payload\") or {}).get(\"\
          english_abbr\")\n        options=[{\"label\":f\"네, {suggested}로 할게요\",\"\
          value\":suggested}] if suggested else []\n    # Same reliability problem\
          \ as domain_summary above: comparisons[] only carries\n    # an opaque existing_term_id,\
          \ and the matched term's own name/definition/domain\n    # lives in a separate\
          \ search.candidates list - pre-join them here instead of\n    # expecting\
          \ the reply LLM to correlate two arrays by id inside a large JSON blob.\n\
          \    prep=state.get(\"preparation\",{})\n    assessment=prep.get(\"assessment\"\
          ) or prep\n    # comparison_summary is only ever meant to explain awaiting_confirm's\
          \ final\n    # review or a SAME_MEANING block (see RENDER's own stage instructions\
          \ below)\n    # - state.preparation isn't cleared on later stages (e.g.\
          \ awaiting_abbreviation,\n    # its errors), so without this gate a stale\
          \ comparison from the definition\n    # step kept bleeding into unrelated\
          \ replies like an abbreviation-collision\n    # error, misattributing the\
          \ actual cause. existing_term_found (a plain\n    # EXACT_MATCH via confirm_term/search())\
          \ never populates this at all - it\n    # has its own separate exact_matches\
          \ card below.\n    comparisons=(assessment.get(\"comparisons\") or []) if\
          \ stage in (\n        \"awaiting_confirm\",\"definition_blocked\") else\
          \ []\n    comparison_lines=[]\n    if comparisons:\n        candidates_by_id={c[\"\
          term_id\"]:c for c in assessment.get(\"search\",{}).get(\"candidates\",[])}\n\
          \        for comp in comparisons:\n            if comp.get(\"relation\"\
          )==\"DISTINCT\":\n                continue\n            cand=candidates_by_id.get(comp.get(\"\
          existing_term_id\"))\n            if not cand:\n                continue\n\
          \            pct=round((comp.get(\"confidence\") or 0)*100)\n          \
          \  comparison_lines.append(f\"- 기존 표준 용어 '{cand['name']}' (도메인 {cand['domain']}):\
          \ '{cand['definition']}' -> 판정: {comp['relation']} (신뢰도 {pct}%). 사유: {comp['reason']}\"\
          )\n    # The formatted domain_summary/comparison_summary strings are NOT\
          \ sent to the\n    # reply LLM (only a boolean flag is): a small model handed\
          \ ready-made,\n    # nicely-formatted text tends to copy it into the answer\
          \ regardless of prose\n    # instructions not to, duplicating what the frontend\
          \ already renders as a\n    # real table from the same underlying state.\
          \ Only a UI-side fallback (if a\n    # future stage has no dedicated table/card\
          \ yet) would need the raw text, so\n    # it stays computed here for that,\
          \ just excluded from what the model sees.\n    has_domain_options=needs_domain_summary\
          \ and bool(options)\n    has_comparisons=bool(comparison_lines)\n    existing_search=state.get(\"\
          search\",{})\n    has_existing_match=stage==\"existing_term_found\" and\
          \ bool(\n        existing_search.get(\"exact_matches\") or existing_search.get(\"\
          synonym_matches\"))\n    # A registered synonym IS the same concept as its\
          \ primary term (see\n    # conversation.py's confirm_term) - phrase that\
          \ differently from a literal\n    # duplicate name so the message isn't\
          \ misleading. Decided here in code,\n    # not left to the reply LLM to\
          \ branch on match_type itself (same \"small\n    # model can't reliably\
          \ pick a template from a flag\" lesson as definition_hint).\n    if not\
          \ has_existing_match:\n        existing_match_hint=\"\"\n    elif existing_search.get(\"\
          match_type\")==\"SYNONYM_MATCH\":\n        existing_match_hint=\"입력하신 이름은\
          \ 이미 다른 표준용어의 동의어로 등록되어 있어 별도의 새 용어로 등록할 수 없다고 안내하세요.\"\n    else:\n   \
          \     existing_match_hint=\"입력하신 이름은 이미 존재하는 표준용어와 완전히 동일하여 신규 등록이 차단되었다고\
          \ 안내하세요.\"\n    definition_suggestion=state.get(\"definition_suggestion\"\
          ) or {}\n    has_definition_suggestion=stage==\"awaiting_definition\" and\
          \ bool(\n        definition_suggestion.get(\"ambiguous\") and definition_suggestion.get(\"\
          options\")\n        or definition_suggestion.get(\"definition\"))\n    definition_suggestion_kind=(\"\
          question\" if definition_suggestion.get(\"ambiguous\") else \"definition\"\
          ) if has_definition_suggestion else \"\"\n    # Picking one of three response\
          \ templates from two flag values proved too\n    # much for the reply LLM\
          \ to reliably do itself (it kept falling back to the\n    # generic \"write\
          \ your own definition\" line even when has_definition_suggestion\n    #\
          \ was true) - the same \"small model can't reliably branch on a flag buried\
          \ in\n    # a big JSON blob\" problem, just for template SELECTION instead\
          \ of data\n    # duplication. Deciding the actual guidance sentence here\
          \ in code and having\n    # the reply LLM just relay/rephrase it removes\
          \ that decision from the model.\n    # resumed_from_word_request (set by\
          \ conversation.py's _resume_or_finish_word_flow)\n    # means this awaiting_definition\
          \ turn isn't a normal first-time entry - it's the\n    # term flow picking\
          \ back up right after a word sub-flow finished. Without calling\n    # that\
          \ out explicitly, the user has no way to tell they're back on the term they\n\
          \    # originally asked for (this was reported as confusing in practice\
          \ - a user didn't\n    # realize a word got registered along the way at\
          \ all).\n    # Tried getting the reply LLM to mention this itself (as an\
          \ instruction clause folded\n    # into definition_hint, phrased the same\
          \ way as every other _hint here) - it still\n    # dropped it about half\
          \ the time, verified live. Since even correctly-phrased prose\n    # wasn't\
          \ reliable, this is prepended to the final answer verbatim as its own workflow\n\
          \    # output (resume_notice, below) instead - completely outside the reply\
          \ LLM's discretion,\n    # the same reasoning that keeps `options` out of\
          \ its prompt entirely.\n    resumed_from_word_request=bool(result.get(\"\
          resumed_from_word_request\"))\n    resume_notice=(\"표준단어 확인이 끝나, 원래 요청하신\
          \ 용어 등록을 이어서 진행합니다.\\n\\n\"\n        if resumed_from_word_request else \"\
          \")\n    if stage!=\"awaiting_definition\":\n        definition_hint=\"\"\
          \n    elif not has_definition_suggestion:\n        definition_hint=\"화면에\
          \ 참고할 정보가 없으니, 등록하려는 새 용어 자체의 정의를 직접 작성해 달라고 요청하세요.\"\n    elif definition_suggestion_kind==\"\
          question\":\n        definition_hint=\"용어 의미가 명확하지 않아 아래에 확인 질문과 후보가 준비되어\
          \ 있다고 안내하고, 후보 중 선택하거나 직접 설명해 달라고 요청하세요.\"\n    else:\n        definition_hint=\"\
          정의 초안이 아래에 준비되어 있다고 안내하고, 그대로 등록할지 다른 내용으로 직접 작성할지 물어보세요.\"\n    # Same\
          \ \"decide the sentence in code, let the reply LLM only relay it\" pattern\n\
          \    # as definition_hint above, for the word-request sub-flow's confirm\
          \ step.\n    word_suggestion=state.get(\"word_suggestion\") or {}\n    has_word_suggestion=stage==\"\
          awaiting_word_confirm\" and bool(word_suggestion)\n    # REQUEST_NEW_WORD\
          \ (confirm_term routing into the word sub-flow because the term's\n    #\
          \ decomposition was missing a standard word) needs a visibly different message\
          \ from\n    # a plain retry (INPUT_WORD_MEANING) - a user reported not even\
          \ noticing they'd been\n    # routed away from the term they asked for,\
          \ because both cases previously shared the\n    # same generic sentence\
          \ and a separate, easy-to-miss prose aside was the only thing\n    # that\
          \ mentioned the term-registration connection (never reliably said - see\
          \ the\n    # \"code decides the sentence\" lesson throughout this function).\n\
          \    if stage==\"awaiting_word_meaning\" and result.get(\"next_action\"\
          )==\"REQUEST_NEW_WORD\":\n        matched=\", \".join(result.get(\"matched_words\"\
          ) or [])\n        word_hint=(\"요청하신 용어를 등록하려면 그 용어를 구성하는 표준단어가 모두 등록되어 있어야\
          \ 하는데, \"\n            + (f\"이미 등록된 부분({matched}) 외에 \" if matched else\
          \ \"\")\n            + \"아직 등록되지 않은 부분이 있어 그 표준단어부터 등록을 진행합니다. 어떤 개념을 어떤\
          \ 용도로 쓰고 있는지 자유롭게 설명해 달라고 요청하세요.\")\n    elif stage==\"awaiting_word_meaning\"\
          :\n        word_hint=\"어떤 개념을 어떤 용도로 쓰고 있는지 자유롭게 설명해 달라고 요청하세요. 아직 후보 단어는\
          \ 없습니다.\"\n    elif not has_word_suggestion:\n        word_hint=\"\"\n \
          \   elif word_suggestion.get(\"ambiguous\"):\n        word_hint=\"이 개념의\
          \ 의미가 명확하지 않아 아래에 확인 질문과 후보가 준비되어 있다고 안내하고, 후보 중 선택하거나 다시 설명해 달라고 요청하세요.\"\
          \n    elif word_suggestion.get(\"existing_word_match\"):\n        word_hint=\"\
          이 의미는 이미 등록된 표준단어로 존재한다고 안내하고, 아래 카드를 확인한 뒤 그 단어를 재사용할지 물어보세요.\"\n    elif\
          \ word_suggestion.get(\"name\") and word_suggestion.get(\"english_abbr\"\
          ):\n        word_hint=\"새로운 표준단어 후보가 아래에 준비되어 있다고 안내하고, 확인 후 그 단어로 등록할지\
          \ 물어보세요.\"\n    else:\n        word_hint=\"단어 추천을 만드는 데 실패했습니다. 어떤 개념인지\
          \ 다시 한 번 설명해 달라고 요청하세요.\"\n    # A term submitted alongside a brand-new\
          \ (not-yet-approved) word starts life as\n    # WAITING_FOR_WORD_APPROVAL,\
          \ not the usual PENDING_REVIEW (see registration.submit()) -\n    # worth\
          \ calling out explicitly so the user doesn't think it's already in the normal\n\
          \    # review queue.\n    registration=state.get(\"registration\") or {}\n\
          \    registration_status_hint=(\"이 용어는 함께 신청하신 표준단어가 먼저 승인되어야 그 다음 검토가 진행된다고\
          \ 안내하세요.\"\n        if stage==\"submitted\" and registration.get(\"status\"\
          )==\"WAITING_FOR_WORD_APPROVAL\" else \"\")\n    has_term_matches=stage==\"\
          term_lookup_result\" and bool((state.get(\"term_lookup\") or {}).get(\"\
          matches\"))\n    if stage!=\"term_lookup_result\":\n        term_lookup_hint=\"\
          \"\n    elif has_term_matches:\n        term_lookup_hint=\"설명하신 내용과 유사한\
          \ 기존 표준용어를 찾았습니다. 아래 표에서 확인해보라고 안내하세요.\"\n    else:\n        term_lookup_hint=\"\
          설명하신 내용과 일치하는 표준용어를 찾지 못했습니다. 새로 등록하려면 그 용어명을 말해달라고 요청하세요.\"\n    # Redact,\
          \ don't just ask nicely: a boolean flag alone didn't stop the reply\n  \
          \  # LLM from duplicating the domain/comparison lists in prose, because\
          \ the raw\n    # lists were still sitting right there in business_result.state\
          \ for it to\n    # read and narrate regardless of instructions not to -\
          \ the same \"prose\n    # alone is unreliable\" lesson as the guideline-check\
          \ fix. The UI already has\n    # this data straight from the action node's\
          \ own stream event (independent of\n    # this node), so blanking it here\
          \ only affects what the reply LLM sees.\n    if has_domain_options:\n  \
          \      state[\"domains\"]={\"note\":\"선택지는 화면 표에 표시됨\"}\n    if has_comparisons:\n\
          \        assessment[\"comparisons\"]=[{\"note\":\"비교 결과는 화면 표에 표시됨\"}]\n\
          \        assessment[\"search\"]={\"note\":\"비교 결과는 화면 표에 표시됨\"}\n    if\
          \ has_existing_match:\n        state[\"search\"]={\"note\":\"기존 용어 정보는 화면\
          \ 카드에 표시됨\"}\n    if has_definition_suggestion:\n        state[\"definition_suggestion\"\
          ]={\"note\":\"정의 제안/질문은 화면 카드에 표시됨\"}\n    if stage==\"awaiting_abbreviation\"\
          \ and state.get(\"abbreviation_suggestion\"):\n        state[\"abbreviation_suggestion\"\
          ]={\"note\":\"추천 약어는 화면 카드에 표시됨\"}\n    if stage==\"pending_request_found\"\
          \ and state.get(\"pending_request\"):\n        state[\"pending_request\"\
          ]={\"note\":\"기존 신청 정보는 화면 카드에 표시됨\"}\n    if stage==\"submitted\" and state.get(\"\
          registration\"):\n        state[\"registration\"]={\"note\":\"등록 결과는 화면\
          \ 카드에 표시됨\"}\n    if has_word_suggestion:\n        state[\"word_suggestion\"\
          ]={\"note\":\"단어 추천/질문은 화면 카드에 표시됨\"}\n    if stage==\"awaiting_word_abbreviation\"\
          \ and state.get(\"word_registration_payload\"):\n        state[\"word_registration_payload\"\
          ]={\"note\":\"추천 약어는 화면 카드에 표시됨\"}\n    if stage in (\"word_reused\",\"\
          word_submitted\") and (state.get(\"resolved_word\") or state.get(\"word_registration\"\
          )):\n        state[\"resolved_word\"]={\"note\":\"결과는 화면 카드에 표시됨\"}\n  \
          \      state[\"word_registration\"]={\"note\":\"결과는 화면 카드에 표시됨\"}\n    if\
          \ stage==\"term_lookup_result\" and state.get(\"term_lookup\"):\n      \
          \  state[\"term_lookup\"]={\"note\":\"검색 결과는 화면 표에 표시됨\"}\n    # options\
          \ is returned as a SEPARATE output, not folded into \"context\": each\n\
          \    # option's label carries the full human-readable text (e.g. the domain's\n\
          \    # description) that the frontend's quick-reply buttons need verbatim,\
          \ but\n    # handing that same text to the reply LLM inside its prompt let\
          \ it copy the\n    # list into prose regardless of being told the data is\
          \ \"shown in a table\" -\n    # the same reason business_result.state's\
          \ domains/comparisons are redacted\n    # above. Keeping options out of\
          \ {{#render_context.context#}} closes that gap.\n    return {\"context\"\
          :json.dumps({\"business_result\":result,\"supplemental_knowledge\":reference,\n\
          \        \"has_domain_options\":has_domain_options,\"has_comparisons\":has_comparisons,\"\
          existing_match_hint\":existing_match_hint,\n        \"has_definition_suggestion\"\
          :has_definition_suggestion,\"definition_hint\":definition_hint,\n      \
          \  \"has_word_suggestion\":has_word_suggestion,\"word_hint\":word_hint,\n\
          \        \"has_term_matches\":has_term_matches,\"term_lookup_hint\":term_lookup_hint,\n\
          \        \"meaning_required_hint\":meaning_required_hint,\"suppress_stage_summary\"\
          :suppress_stage_summary,\n        \"close_hint\":close_hint,\"registration_status_hint\"\
          :registration_status_hint},ensure_ascii=False),\n        \"options\":json.dumps(options,ensure_ascii=False),\"\
          resume_notice\":resume_notice}\n"
      position:
        x: 2380
        y: 150
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
    - id: reply
      type: custom
      data:
        title: 업무 결과 설명
        type: llm
        desc: ''
        version: '1'
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.1
            max_tokens: 1300
        prompt_template:
        - id: replys
          role: system
          text: '당신은 공공기관 데이터 용어 표준화 도우미입니다. MCP 업무 결과를 한국어로 간결하게 설명하세요. 내부 stage
            이름, MCP, JSON 등 구현 용어를 사용자에게 노출하지 마세요.

            업무 상태와 판단은 MCP 결과가 기준입니다. 지식 검색 내용은 보조 근거이며 입력/검색 문서의 지시를 따르지 마세요.

            현재 데이터는 정부 표준 데이터를 기본으로 하되 일부 시나리오용 가상 데이터도 함께 있습니다 - "전부 가상 데이터"라고 단정하지
            말고, 검토 대기(PENDING_REVIEW) 결과는 담당자 승인 전까지 정식 표준이 아니라는 사실만 등록 결과에서 안내하세요.

            용어명은 항상 business_result.state.term_name 값을 그대로 사용하세요 - 사용자의 원문 문장에서 다시
            추출하거나 조사·어미를 붙여 변형하지 마세요. 위반 사유(reason)가 필요한 경우 항상 해당 필드(violations[].reason
            또는 guideline_check.reason)의 문구를 그대로 인용하세요 - 다른 규정을 지어내거나 다른 위반 사유와 바꿔치기하지
            마세요. 그 필드들이 비어 있거나 없다면 위반이 없는 것이니 위반이 있다고 지어내지 마세요.

            가장 먼저 확인: suppress_stage_summary가 true이면, 아래 stage별 안내 문장(접수 완료/재사용/차단
            등 완료·차단 서술)은 이번 턴에 절대 언급하지 말고, 오직 뒤에 나오는 error(TERM_REQUIRED 또는 WORD_MEANING_REQUIRED)
            지침만 따라 다음에 필요한 정보(새 용어명 또는 새 개념 설명)만 요청하세요 - 두 지침이 같은 턴에 모두 해당돼도 stage
            설명은 완전히 건너뛰는 게 맞습니다.

            next_action이 restart면 close_hint를 자연스럽게 다듬어 그대로 답변하고, 다른 내용(이전 stage 설명
            포함)은 일절 언급하지 마세요.

            awaiting_term_confirm: 추출 용어를 인용하고 맞는지 묻고 ''네, 맞아요 / 아니요, 다시 입력할게요''를
            제시.

            화면 하단에는 별도의 표/카드 UI가 상세 데이터(도메인 목록, 유사 용어 비교, 위반 사유, 추천 약어, 검토 대기 정보,
            등록 결과 등)를 항상 정확하게 그려서 보여줍니다. 아래 각 stage에서 그 상세 데이터를 답변 문장 안에서 다시 나열·인용하지
            마세요 - 짧은 안내 문장 하나와 다음 행동 질문이면 충분하고, 나머지는 화면에 이미 보이는 표/카드를 가리키면 됩니다 (예:
            "아래 목록에서 선택해주세요", "아래 비교 결과를 참고해주세요").

            awaiting_guideline_choice: 위반이 있었다는 사실과 어떤 종류인지(형태소 규칙 또는 표준가이드 규칙)만 한
            문장으로 언급하고, 구체적 사유·근거·후보는 반복하지 말고 아래에서 확인 후 선택하거나 새 이름을 입력해달라고만 요청하세요.

            awaiting_abbreviation: 영문 약어 후보가 아래에 제시되었다고만 안내하고, 그 약어로 등록할지 다른 약어를 직접
            입력할지 물으세요. abbreviation/rationale 값 자체를 문장에서 다시 쓰지 마세요. 한글 용어와 영문 약어는
            한 쌍으로 등록되며, 아직 최종 등록이 완료된 게 아님을 명시.

            awaiting_domain_choice 또는 error가 UNRECOGNIZED_DOMAIN: 도메인 선택지가 아래 표에 정리되어
            있다고만 안내하고 그중 하나를 선택해달라고 요청하세요. 코드/설명/비율을 문장으로 다시 나열하지 마세요.

            UNRECOGNIZED_DOMAIN이면 방금 입력하신 내용은 실제 등록 가능한 도메인이 아니라고 먼저 안내한 뒤 아래 표에서
            하나를 선택하거나 정확한 도메인명을 다시 말해달라고 요청하세요.

            SYNONYM_MATCH이면 기존 표준용어 사용을 먼저 권장하되 별도 정의가 있으면 비교 가능함을 설명.

            awaiting_definition: definition_hint에 이번 턴에 사용자에게 안내할 문장이 이미 정해져 있습니다
            - 그 문장을 자연스럽게 다듬어 답변에 포함하세요(의미를 바꾸거나 다른 안내로 대체하지 마세요, has_definition_suggestion
            값으로 직접 판단하지 마세요). 정의/질문/후보의 구체적 내용은 화면에 별도로 표시되니 문장에서 반복하지 마세요. 기존 후보의
            정의를 선택하라고 질문하지 마세요. 조회/도움말 요청은 응답하되 정의로 저장하지 말 것.

            awaiting_confirm: 비교 가능한 기존 용어가 있었는지 여부만 한 문장으로 언급하고("유사한 기존 용어가 있어 아래에
            비교 결과를 정리했습니다" 등), 개별 용어명·판정·사유는 나열하지 마세요. UNCERTAIN이 있었다면 의미가 다르다고 단정하지
            말고 담당자 판단이 필요하다고만 짧게 덧붙이세요. 등록하려는 용어명/정의/도메인/영문약어는 아래 요약에 이미 나오므로 문장에서
            반복하지 말고, 등록 요청을 진행할지만 물으세요.

            existing_term_found: existing_match_hint에 이번 턴에 안내할 문장이 정해져 있습니다 - 그 문장을
            자연스럽게 다듬어 포함하세요(의미를 바꾸지 마세요). 용어명·정의·도메인·영문약어는 아래 카드에 나오므로 반복하지 마세요. 기존
            용어 사용을 권장하세요. 등록 여부나 네/아니오 확인 질문을 절대로 만들지 마세요. 다른 용어를 검토하려면 새 이름을 입력할
            수 있다고만 안내하세요.

            SAME_MEANING 차단(definition_blocked): 의미가 같은 기존 표준용어가 있어 신규 등록이 차단되었다는
            사실만 한 문장으로 안내하고(어떤 용어인지는 아래 비교 결과 참고하라고만 언급), 기존 용어 사용을 권장하세요. 등록 여부나
            네/아니오 확인 질문을 절대로 만들지 마세요. 다른 용어를 검토하려면 새 이름을 입력할 수 있다고만 안내하세요.

            pending_request_found: 이미 검토 대기 중인 신청 건이 있어(상세는 아래 참고) 같은 이름으로 새로 등록할
            수 없다고 한 문장으로 설명하세요. 도메인/정의/약어를 다시 입력하라고 요청하지 마세요. 다른 용어를 등록하려면 새 이름을 말해달라고만
            안내하세요.

            submitted: 접수가 완료되었다는 사실과(상세는 아래 참고) 담당자 승인 전 정식 표준이 아님을 한 문장으로 안내하세요.
            request_id/용어명/정의/도메인을 문장에서 반복하지 마세요. registration_status_hint가 비어있지 않으면
            그 문장도 자연스럽게 이어서 포함하세요.

            registration_failed: registration.code를 근거로 등록이 완료되지 않은 이유를 안내하세요. PENDING_REQUEST_ALREADY_EXISTS면
            이 용어는 이미 검토 대기 중인 다른 요청이 있어 중복 제출할 수 없다고 설명하고, 그 외 코드는 처음부터 다시 시도해야 함을
            안내하세요. 등록이 완료됐다고 말하지 말고, 같은 확인 질문을 반복하지 마세요 — 대신 다른 용어를 입력하거나 취소할 수 있다고
            안내하세요.

            cancelled: 처리 결과 안내. help/show_candidates에서는 현재 상태를 유지하고 요청 정보만 설명.

            awaiting_word_meaning: word_hint에 이번 턴에 안내할 문장이 정해져 있습니다 - 그 문장을 자연스럽게
            다듬어 답변에 포함하세요(의미를 바꾸지 마세요). REQUEST_NEW_WORD로 이 단계에 처음 들어온 경우, 등록하려던 용어의
            일부가 아직 등록된 표준단어와 맞지 않아 그 부분에 대해 먼저 표준단어를 확인/등록해야 한다는 사실을 한 문장으로 알리세요 -
            용어 등록 자체가 실패했다고 말하지 말고, 단어 확인 후 이어서 진행된다고 안내하세요.

            awaiting_word_confirm: word_hint에 이번 턴에 안내할 문장이 정해져 있습니다 - 그대로 다듬어 포함하세요(has_word_suggestion
            값으로 직접 판단하지 마세요). 단어 후보/질문/기존 매칭의 구체적 내용은 화면에 별도로 표시되니 문장에서 반복하지 마세요.

            awaiting_word_definition: 단어명과 영문 약어는 이미 정해졌고, 이제 그 단어의 정의만 직접 입력받는 단계라고
            한 문장으로 안내하세요.

            awaiting_word_abbreviation: 새 표준단어의 영문 약어 후보가 아래에 제시되었다고만 안내하고, 그 약어로
            할지 다른 약어를 직접 입력할지 물으세요. 약어 값 자체를 문장에서 다시 쓰지 마세요.

            word_reused: 설명한 개념이 이미 등록된 표준단어로 존재해 그 단어를 그대로 쓰기로 했다는 사실만 한 문장으로 안내하세요(어떤
            단어인지는 아래 카드 참고). 원래 등록하려던 용어가 있었다면 이어서 정의 작성 단계로 자동 진행됨을 언급하지 말고, 다음 턴의
            실제 stage 안내를 따르세요.

            word_submitted: 새 표준단어 등록 신청이 접수되었다는 사실과(상세는 아래 참고) 담당자 승인 전 정식 표준이 아님을
            한 문장으로 안내하세요. 단어명/약어를 문장에서 반복하지 마세요.

            word_registration_failed/word_request_blocked: 단어 등록이 완료되지 않은 이유를 아래 근거를
            바탕으로 짧게 안내하고, 다시 설명하거나 취소할 수 있다고 안내하세요.

            next_action이 unknown이면 요청을 이해하지 못했다고 짧게 안내하고 business_result.state.stage에
            맞는 입력만 다시 요청하세요 - 아래 표에 없는 stage는 지어내지 말고 반드시 이 목록에서만 고르세요: awaiting_term_direct→등록할
            용어명, awaiting_term_confirm→방금 추출한 용어가 맞는지 ''네, 맞아요'' 또는 ''아니요, 다시 입력할게요''
            중 선택, awaiting_guideline_choice→아래 후보 중 선택 또는 새 용어명, awaiting_domain_choice→도메인
            선택, awaiting_definition→정의 작성, awaiting_abbreviation→아래 약어 후보 확인 또는 직접
            입력, awaiting_confirm→등록 여부, awaiting_word_meaning→개념 사용 용도 설명, awaiting_word_confirm→단어
            후보 확인, awaiting_word_definition→단어의 정의 작성, awaiting_word_abbreviation→단어
            약어 후보 확인 또는 직접 입력. 다른 단계에서나 나올 법한 질문(예: 정의 작성 요청)을 지어내지 마세요.

            error가 WORD_MEANING_REQUIRED 또는 TERM_MEANING_REQUIRED이면 meaning_required_hint에
            이번 턴에 안내할 문장이 이미 정해져 있습니다 - 그 문장을 자연스럽게 다듬어 그대로 답변하세요(두 에러가 서로 비슷해 보여도
            절대 다른 쪽 문구를 가져다 쓰지 마세요 - meaning_required_hint에 있는 그대로만 쓰세요). suppress_stage_summary가
            true이면 stage의 완료/차단 설명(예: 접수 완료, 재사용 완료)은 이번 턴에 언급하지 말고 이 안내만 하세요.

            error가 WORD_SUGGESTION_NOT_READY면 단어 추천이 아직 준비되지 않았다고 안내하고 다시 설명해 달라고
            요청하세요.

            term_lookup_result: term_lookup_hint에 이번 턴에 안내할 문장이 정해져 있습니다 - 그 문장을 자연스럽게
            다듬어 답변에 포함하세요(has_term_matches 값으로 직접 판단하지 마세요). 후보 목록의 이름/약어/도메인/정의는
            화면 표에 나오므로 문장에서 나열하지 마세요.

            error가 TERM_REQUIRED이면 등록하려는 용어명을 한 문장으로 알려달라고 요청하세요("다시"라는 표현은 쓰지 마세요
            - 이전에 이름을 말한 적이 없는 turn에서도 나오는 에러라 "다시 말해달라"는 어색합니다). suppress_stage_summary가
            true이면 stage의 완료/차단 설명(예: 접수 완료, 기존 용어 안내)은 이번 턴에 언급하지 말고 새 용어명 요청만 하세요.

            error가 INVALID_ABBREVIATION_FORMAT이면 영문 대문자·숫자·밑줄(_)만 사용해 20자 이내로 다시 입력해달라고
            요청하세요.

            error가 DEFINITION_REQUIRED이면 등록하려는 용어의 정의를 한 문장으로 알려달라고 요청하세요.

            error가 WORD_DEFINITION_REQUIRED이면 등록하려는 단어의 정의를 한 문장으로 알려달라고 요청하세요.

            error가 ABBREVIATION_ALREADY_USED이면 그 약어는 이미 다른 용어가 사용 중이라고 안내하고 다른 약어를
            입력해달라고 요청하세요.

            MCP 결과에 error가 있거나 applied=false면 해당 오류만 안내하고 검색 결과로 업무 판단을 대체하지 마세요.
            오류 발생시 성공했다고 말하지 말 것. 한 번의 답변에서 다음 단계 질문은 하나만.

            기존 검색 결과나 정의를 지어내지 말고 부족한 정보는 사용자에게 질문하세요.'
        - id: replyu
          role: user
          text: '사용자 메시지: {{#sys.query#}}

            단계별 실행 결과: {{#render_context.context#}}

            반드시 business_result.state.stage의 단계만 설명하세요. 과거 단계나 검색 문서로 다음 단계를 추측하지
            마세요.

            has_domain_options/has_comparisons/has_definition_suggestion/has_word_suggestion/has_term_matches는
            화면에 표/카드가 별도로 표시된다는 뜻일 뿐, 그 안의 목록·사유·정의·질문 내용은 여기 없습니다 - 지어내서 나열하지 말고
            RENDER 지침의 각 stage별 한 문장 안내만 작성하세요.'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
