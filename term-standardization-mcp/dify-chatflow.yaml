          \ pick a template from a flag\" lesson as definition_hint).\n    if not\
          \ has_existing_match:\n        existing_match_hint=\"\"\n    elif existing_search.get(\"\
          match_type\")==\"SYNONYM_MATCH\":\n        existing_match_hint=\"입력하신 이름은\
          \ 이미 다른 표준용어의 동의어로 등록되어 있어 별도의 새 용어로 등록할 수 없다고 안내하세요.\"\n    else:\n   \
          \     existing_match_hint=\"입력하신 이름은 이미 존재하는 표준용어와 완전히 동일하여 신규 등록이 차단되었다고\
          \ 안내하세요.\"\n    definition_suggestion=state.get(\"definition_suggestion\"\
          ) or {}\n    has_definition_suggestion=stage==\"awaiting_definition\" and\
          \ bool(\n        definition_suggestion.get(\"ambiguous\") and definition_suggestion.get(\"\
          options\")\n        or definition_suggestion.get(\"definition\"))\n    definition_suggestion_kind=(\"\
          question\" if definition_suggestion.get(\"ambiguous\") else \"definition\"\
          ) if has_definition_suggestion else \"\"\n    # Picking one of three response\
          \ templates from two flag values proved too\n    # much for the reply LLM\
          \ to reliably do itself (it kept falling back to the\n    # generic \"write\
          \ your own definition\" line even when has_definition_suggestion\n    #\
          \ was true) - the same \"small model can't reliably branch on a flag buried\
          \ in\n    # a big JSON blob\" problem, just for template SELECTION instead\
          \ of data\n    # duplication. Deciding the actual guidance sentence here\
          \ in code and having\n    # the reply LLM just relay/rephrase it removes\
          \ that decision from the model.\n    if stage!=\"awaiting_definition\":\n\
          \        definition_hint=\"\"\n    elif not has_definition_suggestion:\n\
          \        definition_hint=\"화면에 참고할 정보가 없으니, 등록하려는 새 용어 자체의 정의를 직접 작성해 달라고\
          \ 요청하세요.\"\n    elif definition_suggestion_kind==\"question\":\n       \
          \ definition_hint=\"용어 의미가 명확하지 않아 아래에 확인 질문과 후보가 준비되어 있다고 안내하고, 후보 중 선택하거나\
          \ 직접 설명해 달라고 요청하세요.\"\n    else:\n        definition_hint=\"정의 초안이 아래에 준비되어\
          \ 있다고 안내하고, 그대로 등록할지 다른 내용으로 직접 작성할지 물어보세요.\"\n    # Same \"decide the sentence\
          \ in code, let the reply LLM only relay it\" pattern\n    # as definition_hint\
          \ above, for the word-request sub-flow's confirm step.\n    word_suggestion=state.get(\"\
          word_suggestion\") or {}\n    has_word_suggestion=stage==\"awaiting_word_confirm\"\
          \ and bool(word_suggestion)\n    if stage==\"awaiting_word_meaning\":\n\
          \        word_hint=\"어떤 개념을 어떤 용도로 쓰고 있는지 자유롭게 설명해 달라고 요청하세요. 아직 후보 단어는\
          \ 없습니다.\"\n    elif not has_word_suggestion:\n        word_hint=\"\"\n \
          \   elif word_suggestion.get(\"ambiguous\"):\n        word_hint=\"이 개념의\
          \ 의미가 명확하지 않아 아래에 확인 질문과 후보가 준비되어 있다고 안내하고, 후보 중 선택하거나 다시 설명해 달라고 요청하세요.\"\
          \n    elif word_suggestion.get(\"existing_word_match\"):\n        word_hint=\"\
          이 의미는 이미 등록된 표준단어로 존재한다고 안내하고, 아래 카드를 확인한 뒤 그 단어를 재사용할지 물어보세요.\"\n    elif\
          \ word_suggestion.get(\"name\") and word_suggestion.get(\"english_abbr\"\
          ):\n        word_hint=\"새로운 표준단어 후보가 아래에 준비되어 있다고 안내하고, 확인 후 그 단어로 등록할지\
          \ 물어보세요.\"\n    else:\n        word_hint=\"단어 추천을 만드는 데 실패했습니다. 어떤 개념인지\
          \ 다시 한 번 설명해 달라고 요청하세요.\"\n    # Redact, don't just ask nicely: a boolean\
          \ flag alone didn't stop the reply\n    # LLM from duplicating the domain/comparison\
          \ lists in prose, because the raw\n    # lists were still sitting right\
          \ there in business_result.state for it to\n    # read and narrate regardless\
          \ of instructions not to - the same \"prose\n    # alone is unreliable\"\
          \ lesson as the guideline-check fix. The UI already has\n    # this data\
          \ straight from the action node's own stream event (independent of\n   \
          \ # this node), so blanking it here only affects what the reply LLM sees.\n\
          \    if has_domain_options:\n        state[\"domains\"]={\"note\":\"선택지는\
          \ 화면 표에 표시됨\"}\n    if has_comparisons:\n        assessment[\"comparisons\"\
          ]=[{\"note\":\"비교 결과는 화면 표에 표시됨\"}]\n        assessment[\"search\"]={\"\
          note\":\"비교 결과는 화면 표에 표시됨\"}\n    if has_existing_match:\n        state[\"\
          search\"]={\"note\":\"기존 용어 정보는 화면 카드에 표시됨\"}\n    if has_definition_suggestion:\n\
          \        state[\"definition_suggestion\"]={\"note\":\"정의 제안/질문은 화면 카드에 표시됨\"\
          }\n    if stage==\"awaiting_abbreviation\" and state.get(\"abbreviation_suggestion\"\
          ):\n        state[\"abbreviation_suggestion\"]={\"note\":\"추천 약어는 화면 카드에\
          \ 표시됨\"}\n    if stage==\"pending_request_found\" and state.get(\"pending_request\"\
          ):\n        state[\"pending_request\"]={\"note\":\"기존 신청 정보는 화면 카드에 표시됨\"\
          }\n    if stage==\"submitted\" and state.get(\"registration\"):\n      \
          \  state[\"registration\"]={\"note\":\"등록 결과는 화면 카드에 표시됨\"}\n    if has_word_suggestion:\n\
          \        state[\"word_suggestion\"]={\"note\":\"단어 추천/질문은 화면 카드에 표시됨\"}\n\
          \    if stage==\"awaiting_word_abbreviation\" and state.get(\"word_registration_payload\"\
          ):\n        state[\"word_registration_payload\"]={\"note\":\"추천 약어는 화면 카드에\
          \ 표시됨\"}\n    if stage in (\"word_reused\",\"word_submitted\") and (state.get(\"\
          resolved_word\") or state.get(\"word_registration\")):\n        state[\"\
          resolved_word\"]={\"note\":\"결과는 화면 카드에 표시됨\"}\n        state[\"word_registration\"\
          ]={\"note\":\"결과는 화면 카드에 표시됨\"}\n    # options is returned as a SEPARATE\
          \ output, not folded into \"context\": each\n    # option's label carries\
          \ the full human-readable text (e.g. the domain's\n    # description) that\
          \ the frontend's quick-reply buttons need verbatim, but\n    # handing that\
          \ same text to the reply LLM inside its prompt let it copy the\n    # list\
