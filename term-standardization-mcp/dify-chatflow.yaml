          \    # above. Keeping options out of {{#render_context.context#}} closes\
          \ that gap.\n    return {\"context\":json.dumps({\"business_result\":result,\"\
          supplemental_knowledge\":reference,\n        \"has_domain_options\":has_domain_options,\"\
          has_comparisons\":has_comparisons,\"existing_match_hint\":existing_match_hint,\n\
          \        \"has_definition_suggestion\":has_definition_suggestion,\"definition_hint\"\
          :definition_hint,\n        \"has_word_suggestion\":has_word_suggestion,\"\
          word_hint\":word_hint},ensure_ascii=False),\n        \"options\":json.dumps(options,ensure_ascii=False)}\n"
      position:
